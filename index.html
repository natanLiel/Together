d\" stroke-linejoin=\"round\"><path d=\"M4 12h15\"><\u002Fpath><path d=\"m13 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <button class=\"btn btn-ghost tg-tap\" style=\"font-size:12px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\" sc-camel-on-click=\"{{ openEnd }}\">End this connection<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.questions }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);animation:tg-in .3s ease\">\n              <div style=\"display:flex;gap:6px;margin-bottom:var(--space-6)\">\n                <sc-for list=\"{{ qBars }}\" as=\"bar\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;height:5px;border-radius:999px;background:{{ bar.bg }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">{{ qCounter }}<\u002Fspan>\n              <h2 style=\"font-size:30px;margin:var(--space-2) 0 var(--space-4);line-height:1.15\">{{ qText }}<\u002Fh2>\n              <textarea class=\"input\" style=\"border-radius:var(--radius-md);min-height:150px;padding:14px;font-family:var(--font-body);font-size:15px;resize:none\" value=\"{{ qDraft }}\" sc-camel-on-input=\"{{ set.qDraft }}\" placeholder=\"However much you feel like saying\"><\u002Ftextarea>\n              <div style=\"flex:1;min-height:var(--space-6)\"><\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ answerQ }}\">{{ qCta }}<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ skipQ }}\">Skip this one<\u002Fbutton>\n              <p style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-align:center;margin:var(--space-3) 0 0;text-wrap:pretty\">Answering and skipping count the same. Maya is never told which you chose.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.waiting }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:var(--space-4);padding:var(--space-8);animation:tg-in .3s ease\">\n              <div style=\"position:relative;width:130px;height:130px;display:grid;place-items:center\">\n                <div style=\"position:absolute;inset:0;border-radius:999px;background:var(--color-accent-2-200);animation:tg-breathe 3.2s ease-in-out infinite\"><\u002Fdiv>\n                <div class=\"washed\" style=\"width:74px;height:74px;border-radius:999px;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-2-600));display:grid;place-items:center;color:#fff;font-family:var(--font-heading);font-size:28px;position:relative\">M<\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">Your part is done<\u002Fh2>\n              <p style=\"font-size:15px;color:var(--color-accent-800);margin:0;max-width:270px;text-wrap:pretty\">Chat opens the moment Maya has taken her turn. We will tell you — and nothing about what she chose.<\u002Fp>\n              <div class=\"card elev-sm\" style=\"width:100%;text-align:start;gap:6px;margin-top:var(--space-4)\">\n                <span class=\"card-kicker\">While you wait<\u002Fspan>\n                <p style=\"font-size:13.5px;margin:0\">We nudge her at 24 hours, then once more at 48. After that it is yours to end whenever you like.<\u002Fp>\n              <\u002Fdiv>\n              <button class=\"btn btn-secondary tg-tap\" style=\"height:46px;padding:0 26px;margin-top:var(--space-2)\" sc-camel-on-click=\"{{ go.discover }}\">Keep browsing<\u002Fbutton>\n              <button class=\"btn btn-ghost tg-tap\" style=\"font-size:12.5px\" sc-camel-on-click=\"{{ simulateUnlock }}\">Simulate: Maya takes her turn<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.videocall }}\">\n            <div style=\"min-height:730px;background:var(--color-neutral-900);display:flex;flex-direction:column;position:relative;animation:tg-in .3s ease\">\n              <div class=\"washed\" style=\"flex:1;background:linear-gradient(160deg,var(--color-accent-2-500),var(--tg-deep-2));display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:var(--font-heading);font-size:82px\">M<\u002Fdiv>\n              <div style=\"position:absolute;top:16px;inset-inline-start:0;width:100%;display:flex;justify-content:center\">\n                <span style=\"font-size:12.5px;color:#fff;background:rgba(0,0,0,.4);padding:5px 14px;border-radius:999px;font-variant-numeric:tabular-nums\">{{ callClock }}<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"washed\" style=\"position:absolute;top:58px;inset-inline-end:16px;width:96px;height:132px;border-radius:var(--radius-md);background:linear-gradient(150deg,var(--color-accent-400),var(--color-accent-800));display:grid;place-items:center;color:rgba(255,255,255,.8);font-family:var(--font-heading);font-size:28px;box-shadow:var(--shadow-md)\">D<\u002Fdiv>\n              <sc-if value=\"{{ callActivity }}\">\n                <div style=\"position:absolute;inset-inline:16px;bottom:130px;background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--shadow-lg);animation:tg-pop .3s ease\">\n                  <span class=\"card-kicker\">{{ activityKind }}<\u002Fspan>\n                  <h3 style=\"font-size:22px;margin:4px 0 var(--space-3)\">{{ activityText }}<\u002Fh3>\n                  <div style=\"display:flex;gap:8px\">\n                    <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:44px\" sc-camel-on-click=\"{{ activityA }}\">{{ activityOptA }}<\u002Fbutton>\n                    <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:44px\" sc-camel-on-click=\"{{ activityB }}\">{{ activityOptB }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"padding:var(--space-4);display:flex;justify-content:center;gap:var(--space-3);background:var(--color-neutral-900)\">\n                <button class=\"btn btn-icon tg-tap\" style=\"width:54px;height:54px;background:rgba(255,255,255,.14);color:#fff\" sc-camel-on-click=\"{{ nextActivity }}\" aria-label=\"Activities\">\n                  <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"><\u002Frect><\u002Fsvg>\n                <\u002Fbutton>\n                <button class=\"btn btn-icon tg-tap\" style=\"width:54px;height:54px;background:rgba(255,255,255,.14);color:#fff\" aria-label=\"Mute\">\n                  <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2\" width=\"6\" height=\"12\" rx=\"3\"><\u002Frect><path d=\"M5 11a7 7 0 0 0 14 0\"><\u002Fpath><path d=\"M12 18v3\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n                <button class=\"btn btn-icon tg-tap\" style=\"width:54px;height:54px;background:var(--tg-deep);color:#fff\" sc-camel-on-click=\"{{ endCall }}\" aria-label=\"End the call\">\n                  <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10c6-4 12-4 18 0l-2 4-4-1v-2c-3-1-5-1-8 0v2l-4 1-2-4z\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.callended }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:var(--space-3);padding:var(--space-8);animation:tg-in .3s ease\">\n              <svg width=\"140\" height=\"88\" sc-camel-view-box=\"0 0 120 76\" fill=\"none\"><circle cx=\"30\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-500)\"><\u002Fcircle><circle cx=\"90\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-2-600)\"><\u002Fcircle><path d=\"M47 38 C 58 22, 62 54, 73 38\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"120\" style=\"animation:tg-draw 1.2s ease both\"><\u002Fpath><\u002Fsvg>\n              <h2 style=\"font-size:30px;margin:var(--space-3) 0 0\">That was 14 minutes<\u002Fh2>\n              <p style=\"font-size:15px;color:var(--color-accent-800);margin:0;max-width:260px;text-wrap:pretty\">Nothing to rate, nothing to score. Go back and say what you thought.<\u002Fp>\n              <button class=\"btn btn-primary tg-tap\" style=\"height:48px;padding:0 30px;margin-top:var(--space-4)\" sc-camel-on-click=\"{{ go.chat }}\">Back to chat<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showTabs }}\">\n          <div style=\"flex:none;display:flex;background:color-mix(in srgb,var(--color-surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--color-divider);padding:8px 6px 22px\">\n            <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"5\">\n              <button class=\"tg-tap\" style=\"flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;cursor:pointer;color:{{ tab.color }};position:relative\" sc-camel-on-click=\"{{ tab.onClick }}\" aria-label=\"{{ tab.label }}\">\n                <span style=\"position:relative;display:grid;place-items:center;width:44px;height:30px;border-radius:999px;background:{{ tab.pill }};transition:background .2s ease\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ tab.icon }}\"><\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:{{ tab.weight }};letter-spacing:.02em\">{{ tab.label }}<\u002Fspan>\n                <sc-if value=\"{{ tab.badge }}\"><span style=\"position:absolute;top:-1px;inset-inline-end:22%;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--color-accent-600);color:#fff;font-size:9.5px;display:grid;place-items:center\">{{ tab.badgeText }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.like }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:flex;flex-direction:column;justify-content:flex-end;animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-start-start-radius:32px;border-start-end-radius:32px;padding:var(--space-4) var(--space-4) var(--space-6);animation:tg-up .28s ease\" sc-camel-on-click=\"{{ stop }}\">\n              <div style=\"width:42px;height:4px;border-radius:999px;background:var(--color-divider);margin:0 auto var(--space-4)\"><\u002Fdiv>\n              <div style=\"display:flex;gap:var(--space-3);align-items:flex-start;margin-bottom:var(--space-4)\">\n                <div class=\"washed\" style=\"width:52px;height:52px;border-radius:var(--radius-sm);flex:none;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-2-600))\"><\u002Fdiv>\n                <div>\n                  <span class=\"card-kicker\">{{ likeTargetKicker }}<\u002Fspan>\n                  <p style=\"font-size:15px;margin:2px 0 0;font-family:var(--font-heading);line-height:1.25\">{{ likeTargetText }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <textarea class=\"input\" style=\"border-radius:var(--radius-md);width:100%;box-sizing:border-box;min-height:88px;padding:12px 14px;font-family:var(--font-body);font-size:14.5px;resize:none\" value=\"{{ likeComment }}\" sc-camel-on-input=\"{{ set.likeComment }}\" placeholder=\"Say something about it, if you want\"><\u002Ftextarea>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-4)\">\n                <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ sendLike }}\">{{ likeCta }}<\u002Fbutton>\n                <button class=\"btn tg-tap\" style=\"height:50px;width:100%;border:1.5px solid var(--tg-clay);color:var(--tg-clay);background:var(--tg-clay-tint)\" sc-camel-on-click=\"{{ sendRing }}\">\n                  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\"><circle cx=\"12\" cy=\"14\" r=\"6.4\"><\u002Fcircle><path d=\"m8.6 8 1.6-4h3.6l1.6 4\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  Send a ring · {{ ringLeft }}\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <p style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);text-align:center;margin:var(--space-3) 0 0;text-wrap:pretty\">A ring puts you at the top of her list. It does not skip anything that comes after.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.sent }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);text-align:center;animation:tg-pop .3s ease;width:100%\">\n              <div style=\"width:64px;height:64px;border-radius:999px;background:{{ sentIconBg }};display:grid;place-items:center;margin:0 auto var(--space-3)\">\n                <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <h3 style=\"font-size:24px;margin:0 0 6px\">{{ sentTitle }}<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">{{ sentBody }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:46px\" sc-camel-on-click=\"{{ closeOverlay }}\">Keep looking<\u002Fbutton>\n              <button class=\"btn btn-ghost tg-tap\" style=\"font-size:12.5px;margin-top:6px\" sc-camel-on-click=\"{{ simulateMatch }}\">Simulate: Maya likes you back<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.match }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:linear-gradient(170deg,var(--color-neutral-800),var(--color-neutral-900));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .3s ease\">\n            <svg width=\"230\" height=\"120\" sc-camel-view-box=\"0 0 120 76\" fill=\"none\">\n              <circle cx=\"30\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-400)\"><\u002Fcircle>\n              <circle cx=\"90\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-2-300)\"><\u002Fcircle>\n              <path d=\"M47 38 C 58 22, 62 54, 73 38\" stroke=\"#fff\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"120\" style=\"animation:tg-draw 1.4s .3s ease both\"><\u002Fpath>\n            <\u002Fsvg>\n            <h2 style=\"font-size:38px;color:#fff;margin:var(--space-6) 0 var(--space-2)\">You two connected<\u002Fh2>\n            <p style=\"font-size:16px;color:var(--color-neutral-400);margin:0 0 var(--space-8);max-width:270px;text-wrap:pretty\">Three questions each before the chat opens. Small effort, both sides, on purpose.<\u002Fp>\n            <button class=\"btn tg-tap\" style=\"background:var(--color-accent-600);color:#fff;height:52px;padding:0 44px;font-size:15px\" sc-camel-on-click=\"{{ startQuestions }}\">Begin<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.unlocked }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);text-align:center;animation:tg-pop .32s ease;width:100%\">\n              <svg width=\"150\" height=\"94\" sc-camel-view-box=\"0 0 120 76\" fill=\"none\" style=\"margin:0 auto\"><circle cx=\"30\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-500)\"><\u002Fcircle><circle cx=\"90\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-2-600)\"><\u002Fcircle><path d=\"M47 38 C 58 22, 62 54, 73 38\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"120\" style=\"animation:tg-draw 1.2s .2s ease both\"><\u002Fpath><\u002Fsvg>\n              <h3 style=\"font-size:28px;margin:var(--space-3) 0 6px\">Chat is open<\u002Fh3>\n              <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">You both took your turn. That is all either of you will ever know about it.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ enterChat }}\">Open the chat<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.end }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);animation:tg-pop .28s ease;width:100%\" sc-camel-on-click=\"{{ stop }}\">\n              <h3 style=\"font-size:25px;margin:0 0 8px\">End it with Maya?<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">Your slot frees up straight away. You have an hour to change your mind — {{ undoPrice }}.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px;background:var(--color-neutral-900)\" sc-camel-on-click=\"{{ confirmEnd }}\">Yes, end it<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ closeOverlay }}\">Keep it<\u002Fbutton>\n              <button class=\"btn btn-ghost tg-tap\" style=\"width:100%;font-size:12px;margin-top:6px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\" sc-camel-on-click=\"{{ quickExit }}\">End now with no undo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.undo }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .25s ease\">\n            <div style=\"width:120px;height:120px;border-radius:999px;border:3px solid var(--color-accent-200);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-family:var(--font-heading);font-size:26px;color:var(--color-accent-800)\">{{ undoClock }}<\u002Fdiv>\n            <h3 style=\"font-size:26px;margin:var(--space-4) 0 6px\">It is ended<\u002Fh3>\n            <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-6);max-width:260px;text-wrap:pretty\">Maya is not told anything. If this was a mistake, you have until the clock runs out.<\u002Fp>\n            <button class=\"btn btn-primary tg-tap\" style=\"height:48px;padding:0 30px\" sc-camel-on-click=\"{{ undoEnd }}\">Undo · {{ undoPrice }}<\u002Fbutton>\n            <button class=\"btn btn-secondary tg-tap\" style=\"height:46px;padding:0 26px;margin-top:8px\" sc-camel-on-click=\"{{ finishEnd }}\">Close it now<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.freed }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .25s ease\">\n            <div style=\"width:84px;height:84px;border-radius:999px;background:var(--color-accent-2-200);display:grid;place-items:center\"><svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <h3 style=\"font-size:26px;margin:var(--space-4) 0 6px\">Your slot is open<\u002Fh3>\n            <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-6);max-width:250px;text-wrap:pretty\">No summary, no feedback form. Go when you are ready.<\u002Fp>\n            <button class=\"btn btn-primary tg-tap\" style=\"height:48px;padding:0 30px\" sc-camel-on-click=\"{{ backToDiscover }}\">Back to discover<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.restored }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .25s ease\">\n            <svg width=\"150\" height=\"94\" sc-camel-view-box=\"0 0 120 76\" fill=\"none\"><circle cx=\"30\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-500)\"><\u002Fcircle><circle cx=\"90\" cy=\"38\" r=\"17\" fill=\"var(--color-accent-2-600)\"><\u002Fcircle><path d=\"M47 38 C 58 22, 62 54, 73 38\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-dasharray=\"120\" style=\"animation:tg-draw 1s ease both\"><\u002Fpath><\u002Fsvg>\n            <h3 style=\"font-size:26px;margin:var(--space-4) 0 6px\">Back on<\u002Fh3>\n            <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-6);max-width:250px\">The thread is exactly where you left it.<\u002Fp>\n            <button class=\"btn btn-primary tg-tap\" style=\"height:48px;padding:0 30px\" sc-camel-on-click=\"{{ enterChat }}\">Back to chat<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.checkin }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);animation:tg-pop .28s ease;width:100%\">\n              <h3 style=\"font-size:25px;margin:0 0 8px\">Still want this one?<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">Three days, no messages either way. No pressure — we just do not want your only slot sitting idle.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ closeOverlay }}\">Keep waiting<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ openEnd }}\">End the connection<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.chatmenu }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 40%,transparent);display:flex;flex-direction:column;justify-content:flex-end;animation:tg-in .2s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-start-start-radius:28px;border-start-end-radius:28px;padding:var(--space-4);animation:tg-up .25s ease\" sc-camel-on-click=\"{{ stop }}\">\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ openReportChat }}\">Report Maya<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ openBlock }}\">Block Maya<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ openReportChat }}\">Block and report<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block tg-tap\" style=\"height:44px\" sc-camel-on-click=\"{{ closeOverlay }}\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.video }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:flex;flex-direction:column;justify-content:flex-end;animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-start-start-radius:32px;border-start-end-radius:32px;padding:var(--space-4) var(--space-4) var(--space-6);animation:tg-up .28s ease\" sc-camel-on-click=\"{{ stop }}\">\n              <div style=\"width:42px;height:4px;border-radius:999px;background:var(--color-divider);margin:0 auto var(--space-4)\"><\u002Fdiv>\n              <h3 style=\"font-size:24px;margin:0 0 var(--space-1)\">Plan a video date<\u002Fh3>\n              <p style=\"font-size:13.5px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">Pick a time you both keep. The room opens then, not before.<\u002Fp>\n              <div style=\"display:flex;gap:8px;margin-bottom:var(--space-3)\">\n                <input class=\"input\" type=\"date\" style=\"flex:1;height:46px\" value=\"{{ vdDate }}\" sc-camel-on-change=\"{{ set.vdDate }}\">\n                <input class=\"input\" type=\"time\" style=\"flex:1;height:46px\" value=\"{{ vdTime }}\" sc-camel-on-change=\"{{ set.vdTime }}\">\n              <\u002Fdiv>\n              <input class=\"input\" style=\"width:100%;box-sizing:border-box;height:46px;margin-bottom:var(--space-4)\" value=\"{{ vdNote }}\" sc-camel-on-input=\"{{ set.vdNote }}\" placeholder=\"A line to go with it (optional)\">\n              <sc-if value=\"{{ notPremium }}\">\n                <div style=\"border-radius:var(--radius-md);background:var(--color-accent-100);padding:12px 14px;margin-bottom:var(--space-3);font-size:13px;color:var(--color-accent-800)\">Free plan: 16 ILS, charged only if Maya accepts. Sending costs nothing.<\u002Fdiv>\n              <\u002Fsc-if>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ vdInvalid }}\" sc-camel-on-click=\"{{ sendVideoInvite }}\">Send the invite<\u002Fbutton>\n              <button class=\"btn btn-ghost btn-block tg-tap\" style=\"height:44px\" sc-camel-on-click=\"{{ closeOverlay }}\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.videoconfirmed }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);text-align:center;animation:tg-pop .3s ease;width:100%\">\n              <div style=\"width:64px;height:64px;border-radius:999px;background:var(--color-accent-2-600);display:grid;place-items:center;margin:0 auto var(--space-3)\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m22 8-6 4 6 4V8z\"><\u002Fpath><rect x=\"2\" y=\"6\" width=\"14\" height=\"12\" rx=\"3\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n              <h3 style=\"font-size:24px;margin:0 0 6px\">Maya said yes<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4)\">{{ vdWhen }} · we will remind you both fifteen minutes before.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:46px\" sc-camel-on-click=\"{{ startCall }}\">Join now (demo)<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:44px\" sc-camel-on-click=\"{{ closeOverlay }}\">Back to chat<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.upgrade }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);display:flex;flex-direction:column;justify-content:flex-end;animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--tg-deep);color:var(--tg-deep-ink);border-start-start-radius:32px;border-start-end-radius:32px;padding:var(--space-6) var(--space-4);animation:tg-up .28s ease\" sc-camel-on-click=\"{{ stop }}\">\n              <h3 style=\"font-size:28px;margin:0 0 8px;color:#fff\">{{ upTitle }}<\u002Fh3>\n              <p style=\"font-size:14.5px;margin:0 0 var(--space-4);opacity:.85;text-wrap:pretty\">{{ upBody }}<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:var(--space-6)\">\n                <sc-for list=\"{{ upBenefits }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:10px;align-items:center;font-size:14px\">\n                    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--tg-deep-sub)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg>{{ b.text }}\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <button class=\"btn tg-tap btn-block\" style=\"background:var(--tg-deep-ink);color:var(--tg-deep);height:52px;font-size:15px\" sc-camel-on-click=\"{{ doUpgrade }}\">88 NIS a month<\u002Fbutton>\n              <p style=\"font-size:11.5px;text-align:center;opacity:.7;margin:10px 0 0\">Cancel any time. No pressure to stay.<\u002Fp>\n              <button class=\"btn btn-ghost btn-block tg-tap\" style=\"height:44px;color:var(--tg-deep-sub)\" sc-camel-on-click=\"{{ closeOverlay }}\">Not now<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.report }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;padding:var(--space-4);animation:tg-in .22s ease\">\n            <button class=\"btn btn-icon tg-tap\" style=\"align-self:flex-start\" sc-camel-on-click=\"{{ closeOverlay }}\" aria-label=\"Back\"><svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <h3 style=\"font-size:26px;margin:var(--space-3) 0 6px\">What happened?<\u002Fh3>\n            <p style=\"font-size:13.5px;color:var(--color-accent-800);margin:0 0 var(--space-4)\">Two reports from different people block an account immediately.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ reportReasons }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <button class=\"tg-tap\" style=\"text-align:start;background:{{ r.bg }};border:1.5px solid {{ r.border }};border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;font-family:var(--font-body)\" sc-camel-on-click=\"{{ r.pick }}\">\n                  <div style=\"font-size:14.5px;font-weight:600\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:var(--color-accent-800)\">{{ r.hint }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-height:var(--space-4)\"><\u002Fdiv>\n            <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ noReason }}\" sc-camel-on-click=\"{{ submitReport }}\">Send the report<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.block }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);animation:tg-pop .28s ease;width:100%\" sc-camel-on-click=\"{{ stop }}\">\n              <h3 style=\"font-size:25px;margin:0 0 8px\">Block Maya?<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">She cannot message you or see your profile. Unblock from settings whenever you like.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px;background:var(--color-neutral-900)\" sc-camel-on-click=\"{{ confirmBlock }}\">Block<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ closeOverlay }}\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.done }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);text-align:center;animation:tg-pop .3s ease;width:100%\">\n              <div style=\"width:60px;height:60px;border-radius:999px;background:var(--color-accent-2-600);display:grid;place-items:center;margin:0 auto var(--space-3)\"><svg width=\"27\" height=\"27\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <h3 style=\"font-size:24px;margin:0 0 6px\">{{ doneTitle }}<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">{{ doneBody }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:46px\" sc-camel-on-click=\"{{ doneAction }}\">{{ doneCta }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ toast }}\">\n          <div style=\"position:absolute;bottom:96px;inset-inline
