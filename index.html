  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius:                      <\u002Fg>\n                    <\u002Fg>\n                  <\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"width:min(72vw,250px);margin-top:14px;overflow:hidden\">\n                  <div style=\"animation:tg-wordrise .58s 1.36s cubic-bezier(.2,.85,.25,1) both\">\n                    <img class=\"tg-logo-dark\" src=\"68fc14ba-c5cb-4b86-b89a-bb89d354763d\" alt=\"Together\" style=\"display:block;width:100%;height:auto\">\n                    <img class=\"tg-logo-light\" src=\"a4119697-6d6a-40df-bfd7-4f54a44e8922\" alt=\"Together\" style=\"display:block;width:100%;height:auto\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <p style=\"font-size:16px;line-height:1.5;margin:20px 0 0;color:var(--color-accent-800);max-width:264px;text-wrap:pretty;animation:tg-rise .9s 1.95s ease both\">Built to help you find someone worth leaving the app for.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"position:relative;display:flex;flex-direction:column;gap:10px;width:100%;max-width:302px;margin-top:38px;animation:tg-rise .9s 2.15s cubic-bezier(.2,.8,.2,1) both\">\n                <button class=\"btn btn-primary tg-tap\" style=\"height:56px;font-size:16.5px\" sc-camel-on-click=\"{{ go.auth }}\">Open the app<\u002Fbutton>\n                <button class=\"btn btn-ghost tg-tap\" style=\"height:44px;font-size:14px\" sc-camel-on-click=\"{{ autoLogin }}\">I already have an account<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.auth }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-8) var(--space-6) var(--space-6);padding-block-end:70px;animation:tg-in .3s ease\">\n              <img src=\"59b1f544-7370-415d-9c46-303465f6d780\" alt=\"\" style=\"display:block;width:44px;height:auto;margin-bottom:var(--space-2)\">\n              <h2 style=\"font-size:34px;margin:0\">Start here<\u002Fh2>\n              <p style=\"font-size:15px;color:var(--color-accent-800);margin:var(--space-2) 0 0;max-width:280px;text-wrap:pretty\">Together is built for one connection at a time. Setting up takes about two minutes.<\u002Fp>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n                <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px;font-size:15px\" sc-camel-on-click=\"{{ go.basics }}\">Create account<\u002Fbutton>\n                <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:50px;font-size:15px\" sc-camel-on-click=\"{{ go.login }}\">Sign in<\u002Fbutton>\n                <div style=\"display:flex;align-items:center;gap:var(--space-3);margin:var(--space-3) 0;color:color-mix(in srgb,var(--color-text) 45%,transparent);font-size:12px\">\n                  <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv><span>or<\u002Fspan><div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:var(--space-2)\">\n                  <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:48px\" sc-camel-on-click=\"{{ go.basics }}\">Apple<\u002Fbutton>\n                  <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:48px\" sc-camel-on-click=\"{{ go.basics }}\">Google<\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent);text-align:center;margin:var(--space-3) 0 0;text-wrap:pretty\">We verify your phone number. It keeps fake accounts out and stays private.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.login }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-8) var(--space-6) var(- play:flex;flex-direction:column;padding:var(--space-6);padding-block-end:70px;animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:33%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">The basics<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-6)\">Step 1 of 3<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n                <div style=\"display:flex;gap:var(--space-3)\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">First name<\u002Flabel>\n                    <input class=\"input\" style=\"height:46px\" value=\"{{ form.name }}\" sc-camel-on-input=\"{{ set.name }}\" placeholder=\"Daniel\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">Last name<\u002Flabel>\n                    <input class=\"input\" style=\"height:46px\" value=\"{{ form.last }}\" sc-camel-on-input=\"{{ set.last }}\" placeholder=\"Rosen\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">Name tag<\u002Flabel>\n                  <div style=\"display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--color-divider);background:var(--color-surface)\">\n                    <span style=\"font-size:15px;color:var(--color-accent-800)\">@<\u002Fspan>\n                    <input style=\"flex:1;height:100%;border:0;background:transparent;outline:none;font:400 15px var(--font-body);color:var(--color-text)\" value=\"{{ form.handle }}\" sc-camel-on-input=\"{{ set.handle }}\" placeholder=\"danielr\">\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px;color:{{ handleColor }}\">{{ handleNote }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n                    <label style=\"font-size:13px;font-weight:600\">Date of birth<\u002Flabel>\n                    <span style=\"font-size:12px;color:var(--color-accent-800)\">{{ ageLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"position:relative;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-surface);overflow:hidden\">\n                    <div style=\"position:absolute;inset-inline:8px;top:44px;height:44px;border-radius:12px;background:var(--color-accent-100);pointer-events:none\"><\u002Fdiv>\n                    <div style=\"position:relative;display:grid;grid-template-columns:1fr 1.5fr 1.1fr\">\n                      <div class=\"tg-wheel\" data-wheel=\"d\" sc-camel-on-scroll=\"{{ set.bDay }}\">\n                        <sc-for list=\"{{ dayOpts }}\" as=\"o\" hint-placeholder-count=\"31\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div class=\"tg-wheel\" data-wheel=\"m\" sc-camel-on-scroll=\"{{ set.bMonth }}\">\n                        <sc-for list=\"{{ monthOpts }}\" as=\"o\" hint-placeholder-count=\"12\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div class=\"tg-wheel\" data-wheel=\"y\" sc-camel-on-scroll=\"{{ set.bYear }}\">\n                        <sc-for list=\"{{ yearOpts }}\" as=\"o\" hint-placeholder-count=\"40\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">Scroll each column. Your age shows on your profile, never the date.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:var(--space-3)\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">Gender<\u002Flabel>\n                    <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.gender }}\" sc-camel-on-change=\"{{ set.gender }}\">\n                      <option value=\"\">Select<\u002Foption>\n                      <option value=\"Man\">Man<\u002Foption>\n                      <option value=\"Woman\">Woman<\u002Foption>\n                      <option value=\"Other\">Other<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">Show me<\u002Flabel>\n                  <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.seeking }}\" sc-camel-on-change=\"{{ set.seeking }}\">\n                    <option value=\"\">Select<\u002Foption>\n                    <option value=\"Women\">Women<\u002Foption>\n                    <option value=\"Men\">Men<\u002Foption>\n                    <option value=\"Everyone\">Everyone<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">What you are here for<\u002Flabel>\n                  <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.intent }}\" sc-camel-on-change=\"{{ set.intent }}\">\n                    <option value=\"\">Select<\u002Foption>\n                    <option value=\"A relationship\">A relationship<\u002Foption>\n                    <option value=\"Open to a relationship\">Open to a relationship<\u002Foption>\n                    <option value=\"Still working it out\">Still working it out<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-height:var(--space-6)\"><\u002Fdiv>\n              <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 var(--space-2)\">{{ basicsHint }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ basicsInvalid }}\" sc-camel-on-click=\"{{ go.photos }}\">Continue<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.photos }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);padding-block-end:70px;animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:66%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">Photos and prompts<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-4)\">Step 2 of 3 · at least one photo, up to six<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)\">\n                <sc-for list=\"{{ myPhotoSlots }}\" as=\"slot\" hint-placeholder-count=\"6\">\n                  <div class=\"tg-tap\" style=\"aspect-ratio:3/4;border-radius:var(--radius-md);background:{{ slot.bg }};display:grid;place-items:center;color:{{ slot.fg }};font-family:var(--font-heading);font-size:22px;border:{{ slot.border }}\" sc-camel-on-click=\"{{ addPhoto }}\">{{ slot.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:var(--space-2) 0 var(--space-6)\">Your first photo is the one people meet.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-3);border-radius:var(--radius-lg);border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:var(--space-4)\">\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">The scribble · only on Together<\u002Fspan>\n                  <h3 style=\"font-family:var(--font-heading);font-size:22px;margin:0;line-height:1.15\">Tell us the useless things<\u002Fh3>\n                  <p style=\"font-size:13px;margin:0;color:var(--color-accent-800);text-wrap:pretty\">This is not a bio. Nobody reads it but the matcher. It works on the small, specific, slightly embarrassing details — the ones a tick-box list can never hold.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--color-accent-800);text-wrap:pretty\">\n                  <span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:var(--color-accent-600);color:#fff;display:grid;place-items:center;font-size:12px\">1<\u002Fspan>\n                  <span>Two people who both hate the beach in August match better than two people who both ticked \"loves travel\".<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--color-accent-800);text-wrap:pretty\">\n                  <span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:var(--color-accent-600);color:#fff;display:grid;place-items:center;font-size:12px\">2<\u002Fspan>\n                  <span>Spelling, order and coherence do not matter. Lists, fragments, contradictions — all of it is usable.<\u002Fspan>\n                <\u002Fdiv>\n\n                <textarea class=\"input\" style=\"border-radius:var(--radius-md);min-height:150px;padding:14px;font-family:var(--font-body);font-size:14px;line-height:1.5;resize:none;background:var(--color-surface)\" value=\"{{ form.about }}\" sc-camel-on-input=\"{{ set.about }}\" placeholder=\"Start anywhere. The song on repeat at 2am. What you cook when nobody is watching. The argument you keep having with your brother. Cats, but only other people's.\"><\u002Ftextarea>\n\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"font-size:11.5px;color:var(--color-accent-800)\">Stuck? Tap one and keep going.<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                    <sc-for list=\"{{ nudges }}\" as=\"n\" hint-placeholder-count=\"5\">\n                      <button class=\"tg-tap\" style=\"border:1px dashed var(--color-accent-400);background:transparent;color:var(--color-accent-700);border-radius:999px;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;text-align:start;font:400 12.5px var(--font-body);cursor:pointer\" sc-camel-on-click=\"{{ n.add }}\">{{ n.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--color-accent-300);padding-top:var(--space-3)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                    <span style=\"font-size:12px;font-weight:600\">{{ scribbleNote }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:var(--color-accent-800)\">{{ scribbleCount }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:999px;background:var(--color-accent-200);overflow:hidden\"><div style=\"height:100%;width:{{ scribbleW }};background:var(--color-accent-600);border-radius:999px;transition:width .4s ease\"><\u002Fdiv><\u002Fdiv>\n                  <sc-if value=\"{{ hasSignals }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:2px\">\n                      <span style=\"font-size:11.5px;color:var(--color-accent-800)\">Picked up so far<\u002Fspan>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ signals }}\" as=\"s\" hint-placeholder-count=\"3\">\n                          <span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:999px;padding:5px 12px;font-size:12px\">{{ s.label }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <p style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0;text-wrap:pretty\">Private. Never shown on your profile, never quoted to anyone. You can rewrite it any time and matching shifts with it.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-height:var(--space-6)\"><\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ noPhotos }}\" sc-camel-on-click=\"{{ go.verify }}\">Continue<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.verify }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);padding-block-end:70px;animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:100%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">Prove you are you<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-6)\">Step 3 of 3 · optional, and you can do it later<\u002Fp>\n              <div style=\"display:grid;place-items:center;margin:var(--space-4) 0\">\n                <div style=\"width:170px;height:170px;border-radius:999px;background:var(--color-accent-2-200);display:grid;place-items:center\">\n                  <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-6)\">\n                <p style=\"font-size:14px;margin:0\">Takes about a minute.<\u002Fp>\n                <p style=\"font-size:14px;margin:0\">Your selfie stays private — we never publish it.<\u002Fp>\n                <p style=\"font-size:14px;margin:0\">Verified profiles get a check mark and get liked more.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.verifySelfie }}\">Take a selfie<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.welcome }}\">Do this later<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.welcome }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);padding-block-end:70px;animation:tg-in .3s ease\">\n              <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--space-4)\">\n                <h2 style=\"font-size:38px;margin:0;line-height:1.05\">You are in,<br>Daniel.<\u002Fh2>\n                <p style=\"font-size:16px;color:var(--color-accent-800);margin:0;max-width:290px;text-wrap:pretty\">One connection at a time. When it is going somewhere, you will not be distracted. When it is not, you free the slot and move on.<\u002Fp>\n                <div class=\"card elev-sm\" style=\"margin-top:var(--space-4)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                    <span style=\"font-size:13px;font-weight:600\">Profile strength<\u002Fspan>\n                    <span style=\"font-size:13px;color:var(--color-accent-800)\">{{ profilePct }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;border-radius:999px;background:var(--color-accent-2-200);overflow:hidden\">\n                    <div style=\"height:100%;width:{{ profilePctW }};background:var(--color-accent-2-600);border-radius:999px;transition:width .5s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:6px\">\n                    <sc-for list=\"{{ profileSteps }}\" as=\"step\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:{{ step.color }}\">\n                        <span style=\"width:18px;height:18px;border-radius:999px;flex:none;display:grid;place-items:center;background:{{ step.dot }};color:#fff;font-size:11px\">{{ step.mark }}<\u002Fspan>{{ step.label }}\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.discover }}\">Start discovering<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.discover }}\">\n            <div style=\"animation:tg-in .3s ease\">\n              <div style=\"position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--color-bg) 88%,transparent);backdrop-filter:blur(10px);padding:var(--space-2) var(--space-4) var(--space-3)\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)\">\n                  <span style=\"font-family:var(--font-heading);font-size:22px\">Discover<\u002Fspan>\n                  <div class=\"seg\" style=\"height:32px\">\n                    <button class=\"seg-opt tg-tap\" style=\"font-size:12px;padding:0 14px;background:{{ segSingle }}\" sc-camel-on-click=\"{{ setMode.single }}\">People<\u002Fbutton>\n                    <button class=\"seg-opt tg-tap\" style=\"font-size:12px;padding:0 14px;background:{{ segCouple }}\" sc-camel-on-click=\"{{ setMode.couples }}\">Couples<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px\">\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortA }};color:{{ sortAc }}\" sc-camel-on-click=\"{{ setSort.recommended }}\">Recommended<\u002Fbutton>\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortB }};color:{{ sortBc }}\" sc-camel-on-click=\"{{ setSort.nearby }}\">Nearby<\u002Fbutton>\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortC }};color:{{ sortCc }}\" sc-camel-on-click=\"{{ setSort.curated }}\">Curated for you<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ slotFull }}\">\n                <div style=\"margin:0 var(--space-4) var(--space-3);padding:12px 16px;border-radius:var(--radius-md);background:var(--color-accent-2-100);display:flex;gap:10px;align-items:flex-start\">\n                  <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n                  <p style=\"font-size:12.5px;margin:0;color:var(--color-accent-2-800);text-wrap:pretty\">You are focused on Maya. Keep browsing — liking opens again when your slot does.<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ modeCouples }}\">\n                <div style=\"padding:0 var(--space-4) var(--space-6)\">\n                  <div class=\"card elev-sm\" style=\"padding:0;overflow:hidden\">\n                    <div style=\"display:flex;height:210px\">\n                      <div class=\"washed\" style=\"flex:1;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-2-600));display:grid;place-items:center;color:#fff;font-family:var(--font-heading);font-size:40px\">Y<\u002Fdiv>\n                      <div class=\"washed\" style=\"flex:1;background:linear-gradient(150deg,var(--color-accent-300),var(--color-accent-600));display:grid;place-items:center;color:#fff;font-family:var(--font-heading);font-size:40px\">O<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:var(--space-3) var(--space-4) var(--space-4)\">\n                      <h3 style=\"font-size:24px;margin:0\">Yael &amp; Ori<\u002Fh3>\n                      <p style=\"font-size:13px;color:var(--color-accent-800);margin:4px 0 var(--space-3)\">Together 3 years · Florentin · 2 km away<\u002Fp>\n                      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-3)\">\n                        <span class=\"tag tag-accent-2\">Double dates<\u002Fspan>\n                        <span class=\"tag tag-neutral\">Board games<\u002Fspan>\n                        <span class=\"tag tag-neutral\">Friday markets<\u002Fspan>\n                      <\u002Fdiv>\n                      <p style=\"font-size:14px;margin:0 0 var(--space-4);text-wrap:pretty\">We host too much and cook too little. Looking for another couple to argue about films with.<\u002Fp>\n                      <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:46px\" sc-camel-on-click=\"{{ openCoupleMsg }}\">Say hello<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ modeSingle }}\">\n                <div style=\"padding:0 var(--space-4) 118px\">\n                  <sc-if value=\"{{ hasPerson }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div data-tg-deck=\"1\" style=\"display:flex;flex-direction:column;gap:14px;touch-action:pan-y\" sc-camel-on-pointer-down=\"{{ deckDown }}\" sc-camel-on-pointer-move=\"{{ deckMove }}\" sc-camel-on-pointer-up=\"{{ deckUp }}\" sc-camel-on-pointer-cancel=\"{{ deckUp }}\">\n                      <sc-for list=\"{{ feed }}\" as=\"b\" hint-placeholder-count=\"5\">\n                        <div>\n                          <sc-if value=\"{{ b.isHero }}\">\n                            <div style=\"position:relative;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow-md)\">\n                              <div class=\"tg-tap\" style=\"aspect-ratio:4/5;background:{{ b.bg }}\" sc-camel-on-click=\"{{ likePhoto }}\"><\u002Fdiv>\n                              <div style=\"position:absolute;inset:0;background:radial-gradient(112% 66% at 26% 14%,color-mix(in srgb,#fff 15%,transparent) 0%,transparent 60%);pointer-events:none\"><\u002Fdiv>\n                              <div style=\"position:absolute;inset-inline:0;bottom:0;height:56%;background:linear-gradient(to top,color-mix(in srgb,#04070C 86%,transparent) 0%,transparent 100%);pointer-events:none\"><\u002Fdiv>\n                              <div style=\"position:absolute;inset-inline:16px;bottom:16px;display:grid;grid-template-columns:1fr 44px;align-items:end;gap:14px;pointer-events:none\">\n                                <div style=\"min-width:0\">\n                                  <div style=\"display:flex;align-items:center;gap:7px\">\n                                    <h2 style=\"font-size:27px;margin:0;line-height:1.05;color:#FFF8F4\">{{ b.name }}<\u002Fh2>\n                                    <sc-if value=\"{{ b.verified }}\">\n                                      <span style=\"width:19px;height:19px;border-radius:999px;background:var(--color-accent-2-700);display:grid;place-items:center;flex:none\" title=\"Verified\">\n                                        <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 13 4 4L19 7\"><\u002Fpath><\u002Fsvg>\n                                      <\u002Fspan>\n                                    <\u002Fsc-if>\n                                  <\u002Fdiv>\n                                  <p style=\"font-size:12.5px;margin:5px 0 0;color:color-mix(in srgb,#FFF8F4 74%,transparent)\">{{ b.meta }}<\u002Fp>\n                                <\u002Fdiv>\n                              <\u002Fdiv>\n                              <button class=\"tg-tap\" style=\"position:absolute;inset-inline-end:16px;bottom:16px;width:44px;height:44px;border-radius:999px;border:0;background:color-mix(in srgb,#FFF8F4 94%,transparent);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.32)\" sc-camel-on-click=\"{{ likePhoto }}\" aria-label=\"Like this photo\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 1 0-7.4 7.4L12 21.5l8.8-8.5a5.2 5.2 0 0 0 0-7.4z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ b.isPhoto }}\">\n                            <div style=\"position:relative;border-radius:26px;overflow:hidden;isolation:isolate;box-shadow:var(--shadow-md)\">\n                              <div class=\"tg-tap\" style=\"aspect-ratio:4/5;background:{{ b.bg }}\" sc-camel-on-click=\"{{ likePhoto }}\"><\u002Fdiv>\n                              <div style=\"position:absolute;inset:0;background:radial-gradient(110% 64% at 76% 20%,color-mix(in srgb,#fff 18%,transparent) 0%,transparent 60%);pointer-events:none\"><\u002Fdiv>\n                              <span style=\"position:absolute;top:14px;inset-inline-start:14px;height:24px;display:inline-flex;align-items:center;padding:0 11px;border-radius:999px;font-size:11px;color:#FFF8F4;background:rgba(4,7,12,.44);backdrop-filter:blur(6px)\">{{ b.count }}<\u002Fspan>\n                              <button class=\"tg-tap\" style=\"position:absolute;inset-inline-end:16px;bottom:16px;width:44px;height:44px;border-radius:999px;border:0;background:color-mix(in srgb,#FFF8F4 94%,trans n                    <button class=\"btn btn-primary tg-tap\" style=\"height:46px;padding:0 28px\" sc-camel-on-click=\"{{ openUpgrade.likes }}\">See who<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isPremium }}\">\n                <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n                  <div class=\"card elev-sm tg-tap\" style=\"flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3);border:1.5px solid var(--color-accent-400);background:var(--color-accent-100)\" sc-camel-on-click=\"{{ go.discover }}\">\n                    <div style=\"position:relative;flex:none\">\n                      <div class=\"washed\" style=\"width:58px;height:58px;border-radius:999px;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-2-600))\"><\u002Fdiv>\n                      <span style=\"position:absolute;inset:-5px;border-radius:999px;border:2.5px solid var(--color-accent-500)\"><\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex:1\">\n                      <div style=\"font-family:var(--font-heading);font-size:18px\">Jessica, 29<\u002Fdiv>\n                      <div style=\"font-size:13px;color:var(--color-accent-800)\">Sent you a ring<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span class=\"tag tag-accent\">Ring<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ likeRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                    <div class=\"card elev-sm tg-tap tg-row\" style=\"flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3)\">\n                      <div class=\"washed\" style=\"width:56px;height:56px;border-radius:999px;flex:none;background:{{ row.bg }}\"><\u002Fdiv>\n                      <div><div style=\"font-family:var(--font-heading);font-size:17px\">{{ row.name }}<\u002Fdiv><div style=\"font-size:13px;color:var(--color-accent-800)\">{{ row.what }}<\u002Fdiv><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.together }}\">\n            <div style=\"padding:var(--space-2) var(--space-4) var(--space-8);animation:tg-in .3s ease\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:var(--space-1)\">\n                <span style=\"font-family:var(--font-heading);font-size:22px\">Together<\u002Fspan>\n                <span style=\"font-size:12.5px;color:var(--color-accent-800)\">{{ slotLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 var(--space-4)\">{{ slotHint }}<\u002Fp>\n              <sc-if value=\"{{ hasConnection }}\">\n                <div class=\"card elev-sm tg-tap tg-row\" style=\"flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3)\" sc-camel-on-click=\"{{ go.chat }}\">\n                  <div class=\"washed\" style=\"width:60px;height:60px;border-radius:999px;flex:none;background:linear-gradient(150deg,var(--color-accent-2-300),var(--color-accent-2-600));display:grid;place-items:center;color:#fff;font-family:var(--font-heading);font-size:24px\">M<\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:6px\"><span style=\"font-family:var(--font-heading);font-size:19px\">Maya<\u002Fspan><span style=\"width:8px;height:8px;border-radius:999px;background:var(--color-accent-2-600)\"><\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size:13px;color:var(--color-accent-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ lastMessage }}<\u002Fdiv>\n                  <\ gin:0 0 6px\">{{ sentTitle }}<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">{{ sentBody }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:46px\" sc-camel-on-click=\"{{ closeOverlay }}\">Keep looking<\u002Fbutton>\n              <button class=\"btn btn-ghost tg-tap\" style=\"font-size:12.5px;margin-top:6px\" sc-camel-on-click=\"{{ simulateMatch }}\">Simulate: Maya likes you back<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.match }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:linear-gradient(170deg,var(--color-neutral-800),var(--color-neutral-900));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .3s ease\">\n            <img src=\"59b1f544-7370-415d-9c46-303465f6d780\" alt=\"\" style=\"display:block;width:196px;height:auto;animation:tg-pop .6s .15s cubic-bezier(.2,.9,.3,1) both\">\n            <h2 style=\"font-size:38px;color:#fff;margin:var(--space-6) 0 var(--space-2)\">You two connected<\u002Fh2>\n            <p style=\"font-size:16px;color:var(--color-neutral-400);margin:0 0 var(--space-8);max-width:270px;text-wrap:pretty\">You pick three questions for her. She picks three for you. Nothing opens until both sides have taken a turn.<\u002Fp>\n            <button class=\"btn tg-tap\" style=\"background:var(--color-accent-600);color:#fff;height:52px;padding:0 44px;font-size:15px\" sc-camel-on-click=\"{{ startQuestions }}\">Pick your three<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.unlocked }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 50%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);text-align:center;animation:tg-pop .32s ease;width:100%\">\n              <img src=\"59b1f544-7370-415d-9c46-303465f6d780\" alt=\"\" style=\"display:block;width:136px;height:auto;margin:0 auto\">\n              <h3 style=\"font-size:28px;margin:var(--space-3) 0 6px\">Chat is open<\u002Fh3>\n              <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">You both took your turn. That is all either of you will ever know about it.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ enterChat }}\">Open the chat<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.end }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:color-mix(in srgb,var(--color-neutral-900) 46%,transparent);display:grid;place-items:center;padding:var(--space-6);animation:tg-in .22s ease\" sc-camel-on-click=\"{{ closeOverlay }}\">\n            <div style=\"background:var(--color-surface);border-radius:32px;padding:var(--space-6);animation:tg-pop .28s ease;width:100%\" sc-camel-on-click=\"{{ stop }}\">\n              <h3 style=\"font-size:25px;margin:0 0 8px\">End it with Maya?<\u002Fh3>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:0 0 var(--space-4);text-wrap:pretty\">Your slot frees up straight away. You have an hour to change your mind — {{ undoPrice }}.<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:48px;background:var(--color-neutral-900)\" sc-camel-on-click=\"{{ confirmEnd }}\">Yes, end it<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:48px\" sc-camel-on-click=\"{{ closeOverlay }}\">Keep it<\u002Fbutton>\n              <button class=\"btn btn-ghost tg-tap\" style=\"width:100%;font-size:12px;margin-top:6px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\" sc-camel-on-click=\"{{ quickExit }}\">End now with no undo<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.undo }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .25s ease\">\n            <div style=\"width:120px;height:120px;border-radius:999px;border:3px solid var(--color-accent-200);display:grid;place-items:center;font-variant-numeric:tabular-nums;font-family:var(--font-heading);font-size:26px;color:var(--color-accent-800)\">{{ undoClock }}<\u002Fdiv>\n            <h3 style=\"font-size:26px;margin:var(--space-4) 0 6px\">It is ended<\u002Fh3>\n            <p style=\"font-size:14.5px;color:var(--color-accent-800);margin:0 0 var(--space-6);max-width:260px;text-wrap:pretty\">Maya is not told anything. If this was a mistake, you have until the clock runs out.<\u002Fp>\n            <button class=\"btn btn-primary tg-tap\" style=\"height:48px;padding:0 30px\" sc-camel-on-click=\"{{ undoEnd }}\">Undo · {{ undoPrice }}<\u002Fbutton>\n            <button class=\"btn btn-secondary tg-tap\" style=\"height:46px;padding:0 26px;margin-top:8px\" sc-camel-on-click=\"{{ finishEnd }}\">Close it now<\u002Fbutton>\n            <sc-if value=\"{{ notPremium }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:var(--space-4);width:100%;max-width:300px\">\n                <sc-if value=\"{{ couponClosed }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button class=\"tg-tap\" style=\"align-self:center;background:transparent;border:0;padding:5px 4px;font:400 12.5px var(--font-body);color:inherit;opacity:.72;text-decoration:underline;text-underline-offset:3px;cursor:pointer\" sc-camel-on-click=\"{{ openCoupon }}\">Have a discount code?<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ couponOpen }}\">\n                  <div style=\"display:flex;gap:8px\">\n                    <input style=\"flex:1;min-width:0;height:42px;box-sizing:border-box;border-radius:999px;padding:0 16px;font:400 13.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:inherit;background:color-mix(in srgb,currentColor 9%,transparent);border:1px solid color-mix(in srgb,currentColor 26%,transparent)\" value=\"{{ couponCode }}\" sc-camel-on-input=\"{{ set.coupon }}\" placeholder=\"ENTER CODE\">\n                    <button class=\"tg-tap\" style=\"flex:none;height:42px;padding:0 18px;border-radius:999px;border:0;font:600 13px var(--font-body);color:inherit;background:color-mix(in srgb,currentColor 18%,transparent);cursor:pointer\" sc-camel-on-click=\"{{ applyCoupon }}\">Apply<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ couponNote }}\">\n                  <div class=\"tg-tap\" style=\"text-align:center;font-size:12.5px;line-height:1.4;opacity:.92;cursor:pointer\" sc-camel-on-click=\"{{ openCoupon }}\">{{ couponNote }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ overlay.freed }}\">\n          <div style=\"position:absolute;inset:0;z-index:9;background:var(--color-bg);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:var(--space-6);animation:tg-in .25s ease\">\n            <div style=\"width:84px;height:84px;border-radius:999px;background:var(--color-accent-2-200);display:grid;place-items:center\"><svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\"><path d=\"M12 5v14\"><\u002Fpath><path d=\"
