  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

m:none}}\n@keyframes tg-in{from{opacity:0}to{opacity:1}}\n@keyframes tg-pop{0%{opacity:0;transform:scale(.94)}60%{transform:scale(1.01)}100%{opacity:1;transform:scale(1)}}\n@keyframes tg-draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}\n@keyframes tg-breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.16);opacity:.2}}\n@keyframes tg-dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}\n@keyframes tg-mark{0%{opacity:0;transform:scale(.82)}55%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}\n@keyframes tg-word{from{opacity:0;transform:translateY(14px);letter-spacing:.14em}to{opacity:1;transform:none;letter-spacing:0}}\n@keyframes tg-halo{0%,100%{opacity:.28;transform:scale(.9)}50%{opacity:.6;transform:scale(1.12)}}\n@keyframes tg-line{from{stroke-dashoffset:120;opacity:0}to{stroke-dashoffset:0;opacity:1}}\n@media (max-width:820px){\n  [data-tg-shell]{padding:0 !important;gap:0 !important;min-height:100dvh !important;align-items:stretch !important}\n  [data-tg-col]{gap:0 !important;flex:1 !important}\n  [data-tg-rail]{display:none !important}\n  [data-tg-caption]{display:none !important}\n  [data-tg-frame]{width:100vw !important;height:100dvh !important;border-radius:0 !important;padding:0 !important;box-shadow:none !important}\n  [data-tg-phone]{border-radius:0 !important}\n  [data-tg-notch]{display:none !important}\n}\n@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}\n.tg-scroll::-webkit-scrollbar{width:0;height:0}\n.tg-wheel{height:132px;overflow-y:auto;scroll-snap-type:y mandatory;padding:44px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}\n.tg-wheel::-webkit-scrollbar{width:0}\n.tg-wheel > div{height:44px;scroll-snap-align:center;display:grid;place-items:center;font-size:16px;font-variant-numeric:tabular-nums;transition:color .15s ease}\n.tg-row:hover{background:color-mix(in srgb, var(--color-text) 4%, transparent)}\n.tg-tap{cursor:pointer;transition:transform .18s ease, background .18s ease}\n.tg-tap:active{transform:scale(.985)}\n.tg-railbtn{display:block;width:100%;text-align:left;font:400 12px/1.35 var(--font-body);color:var(--color-text);background:transparent;border:0;padding:6px 10px;border-radius:999px;cursor:pointer}\n.tg-railbtn:hover{background:color-mix(in srgb, var(--color-accent) 14%, transparent)}\n.tg-railbtn[data-on=\"1\"]{background:var(--color-accent-600);color:#fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-tg-theme=\"{{ theme }}\" data-tg-shell=\"1\" style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);display:flex;gap:36px;padding:32px 36px;justify-content:center;align-items:flex-start\">\n\n  <div data-tg-col=\"1\" style=\"display:flex;flex-direction:column;gap:14px;align-items:center;flex:none\">\n    <div data-tg-frame=\"1\" style=\"width:412px;height:866px;border-radius:56px;background:var(--color-neutral-900);padding:11px;box-shadow:var(--shadow-lg);flex:none;position:relative\">\n      <div dir=\"{{ dir }}\" data-tg-phone=\"1\" style=\"width:100%;height:100%;border-radius:45px;overflow:hidden;background:var(--color-bg);position:relative;display:flex;flex-direction:column;isolation:isolate\">\n\n        <div style=\"height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--color-text);position:relative;z-index:3\">\n          <span>9:41<\u002Fspan>\n          <div data-tg-notch=\"1\" style=\"position:absolute;left:50%;top:9px;transform:translateX(-50%);width:96px;height:26px;border-radius:999px;background:var(--color-neutral-900)\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:5px\">\n            <svg width=\"17\" height=\"11\" sc-camel-view-box=\"0 0 17 11\" fill=\"currentColor\"><rect x=\"0\" y=\"7\" width=\"3\" height=\"4\" rx=\"1\"><\u002Frect><rect x=\"4.5\" y=\"5\" width=\"3\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"9\" y=\"2.5\" width=\"3\" height=\"8.5\" rx=\"1\"><\u002Frect><rect x=\"13.5\" y=\"0\" width=\"3\" height=\"11\" rx=\"1\"><\u002Frect><\u002Fsvg>\n            <svg width=\"22\" height=\"11\" sc-camel-view-box=\"0 0 22 11\" fill=\"none\"><rect x=\".5\" y=\".5\" width=\"18\" height=\"10\" rx=\"3\" stroke=\"currentColor\" opacity=\".45\"><\u002Frect><rect x=\"2\" y=\"2\" width=\"13\" height=\"7\" rx=\"1.6\" fill=\"currentColor\"><\u002Frect><path d=\"M20.5 4v3\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".45\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ booting }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(130% 85% at 50% 38%,var(--color-accent-200) 0%,var(--color-bg) 70%);opacity:{{ bootOpacity }};transition:opacity 1.4s ease\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:var(--space-6);transform:{{ bootScale }};transition:transform 1.4s cubic-bezier(.3,.7,.2,1)\">\n              <div style=\"position:relative;width:190px;height:190px;display:grid;place-items:center\">\n                <div style=\"position:absolute;inset:0;border-radius:999px;background:radial-gradient(circle,var(--color-accent-500) 0%,transparent 68%);animation:tg-halo 3s ease-in-out infinite\"><\u002Fdiv>\n                <div style=\"position:relative;animation:tg-mark 1.1s cubic-bezier(.2,.8,.2,1) both\"><svg width=\"186\" height=\"129\" sc-camel-view-box=\"0 0 150 104\" fill=\"none\" style=\"position:relative;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))\">\n                  <defs>\n                    <linearGradient id=\"bta\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--color-accent-500)\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--tg-deep)\"><\u002Fstop><\u002FlinearGradient>\n                    <linearGradient id=\"btb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--color-accent-2-500)\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--tg-deep-2)\"><\u002Fstop><\u002FlinearGradient>\n                  <\u002Fdefs>\n                  <circle cx=\"56\" cy=\"52\" r=\"36\" stroke=\"url(#bta)\" stroke-width=\"15\"><\u002Fcircle>\n                  <circle cx=\"94\" cy=\"52\" r=\"36\" stroke=\"url(#btb)\" stroke-width=\"15\"><\u002Fcircle>\n                  <path d=\"M27.8 41.7 A 30 30 0 0 1 50.8 22.4\" stroke=\"rgba(255,255,255,.4)\" stroke-width=\"4.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <path d=\"M65.8 41.7 A 30 30 0 0 1 88.8 22.4\" stroke=\"rgba(255,255,255,.45)\" stroke-width=\"4.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <path d=\"M56 88 A 36 36 0 0 0 79 76\" stroke=\"url(#bta)\" stroke-width=\"15\" stroke-linecap=\"round\"><\u002Fpath>\n                <\u002Fsvg><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:var(--font-heading);font-size:46px;line-height:1;animation:tg-word .9s .45s cubic-bezier(.2,.8,.2,1) both\">Together<\u002Fdiv>\n              <div style=\"font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--color-accent-800);animation:tg-word 1s .95s ease both\">One at a time<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div class=\"tg-scroll\" style=\"flex:1;overflow-y:auto;overflow-x:hidden;position:relative\">\n\n          <sc-if value=\"{{ at.splash }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"height:100%;min-height:640px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-6);padding:var(--space-8) var(--space-6) var(--space-8);text-align:center;background:radial-gradient(120% 60% at 50% 22%,var(--color-accent-200) 0%,var(--color-bg) 68%)\">\n              <div style=\"position:relative;width:210px;height:210px;display:grid;place-items:center;flex:none\">\n                <div style=\"position:absolute;inset:0;border-radius:999px;background:radial-gradient(circle,var(--color-accent-2-400) 0%,transparent 70%);animation:tg-breathe 4.2s ease-in-out infinite\"><\u002Fdiv>\n                <svg width=\"200\" height=\"139\" sc-camel-view-box=\"0 0 150 104\" fill=\"none\" style=\"position:relative;filter:drop-shadow(0 14px 26px rgba(0,0,0,.42))\">\n                  <defs>\n                    <linearGradient id=\"spa\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--color-accent-500)\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--tg-deep)\"><\u002Fstop><\u002FlinearGradient>\n                    <linearGradient id=\"spb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"var(--color-accent-2-500)\"><\u002Fstop><stop offset=\"1\" stop-color=\"var(--tg-deep-2)\"><\u002Fstop><\u002FlinearGradient>\n                  <\u002Fdefs>\n                  <circle cx=\"56\" cy=\"52\" r=\"36\" stroke=\"url(#spa)\" stroke-width=\"15\"><\u002Fcircle>\n                  <circle cx=\"94\" cy=\"52\" r=\"36\" stroke=\"url(#spb)\" stroke-width=\"15\"><\u002Fcircle>\n                  <path d=\"M27.8 41.7 A 30 30 0 0 1 50.8 22.4\" stroke=\"rgba(255,255,255,.4)\" stroke-width=\"4.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <path d=\"M65.8 41.7 A 30 30 0 0 1 88.8 22.4\" stroke=\"rgba(255,255,255,.45)\" stroke-width=\"4.5\" stroke-linecap=\"round\"><\u002Fpath>\n                  <path d=\"M56 88 A 36 36 0 0 0 79 76\" stroke=\"url(#spa)\" stroke-width=\"15\" stroke-linecap=\"round\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n\n              <h1 style=\"font-family:var(--font-heading);font-size:60px;line-height:.95;margin:0;letter-spacing:-.015em\">Together<\u002Fh1>\n              <p style=\"font-size:18px;line-height:1.4;margin:calc(var(--space-4) * -1) 0 0;color:var(--color-accent-800);max-width:270px;text-wrap:pretty\">One person at a time. That is the whole idea.<\u002Fp>\n\n              <div style=\"display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:var(--space-4)\">\n                <button class=\"btn btn-primary tg-tap\" style=\"height:60px;font-size:17px\" sc-camel-on-click=\"{{ go.auth }}\">Open the app<\u002Fbutton>\n                <button class=\"btn btn-ghost tg-tap\" style=\"height:46px;font-size:14px\" sc-camel-on-click=\"{{ autoLogin }}\">I already have an account<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.auth }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-8) var(--space-6) var(--space-6);animation:tg-in .3s ease\">\n              <h2 style=\"font-size:34px;margin:0\">Start here<\u002Fh2>\n              <p style=\"font-size:15px;color:var(--color-accent-800);margin:var(--space-2) 0 0;max-width:280px;text-wrap:pretty\">Together is built for one connection at a time. Setting up takes about two minutes.<\u002Fp>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n                <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px;font-size:15px\" sc-camel-on-click=\"{{ go.basics }}\">Create account<\u002Fbutton>\n                <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:50px;font-size:15px\" sc-camel-on-click=\"{{ go.login }}\">Sign in<\u002Fbutton>\n                <div style=\"display:flex;align-items:center;gap:var(--space-3);margin:var(--space-3) 0;color:color-mix(in srgb,var(--color-text) 45%,transparent);font-size:12px\">\n                  <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv><span>or<\u002Fspan><div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:var(--space-2)\">\n                  <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:48px\" sc-camel-on-click=\"{{ go.basics }}\">Apple<\u002Fbutton>\n                  <button class=\"btn btn-secondary tg-tap\" style=\"flex:1;height:48px\" sc-camel-on-click=\"{{ go.basics }}\">Google<\u002Fbutton>\n                <\u002Fdiv>\n                <p style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent);text-align:center;margin:var(--space-3) 0 0;text-wrap:pretty\">We verify your phone number. It keeps fake accounts out and stays private.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.login }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-8) var(--space-6) var(--space-6);animation:tg-in .3s ease\">\n              <h2 style=\"font-size:32px;margin:0 0 var(--space-6)\">Welcome back<\u002Fh2>\n              <div class=\"field\" style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-3)\">\n                <label style=\"font-size:13px;font-weight:600\">Email<\u002Flabel>\n                <input class=\"input\" style=\"height:46px\" value=\"{{ form.email }}\" sc-camel-on-input=\"{{ set.email }}\" placeholder=\"you@example.com\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"display:flex;flex-direction:column;gap:6px\">\n                <label style=\"font-size:13px;font-weight:600\">Password<\u002Flabel>\n                <input class=\"input\" type=\"password\" style=\"height:46px\" value=\"{{ form.pw }}\" sc-camel-on-input=\"{{ set.pw }}\" placeholder=\"Your password\">\n              <\u002Fdiv>\n              <sc-if value=\"{{ loginError }}\">\n                <p style=\"font-size:13px;color:var(--color-accent-800);background:var(--color-accent-100);padding:10px 14px;border-radius:var(--radius-md);margin:var(--space-3) 0 0\">We could not find an account with that email. Check it, or create one.<\u002Fp>\n              <\u002Fsc-if>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px;margin-top:var(--space-6)\" sc-camel-on-click=\"{{ doLogin }}\">Log in<\u002Fbutton>\n              <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-3)\">\n                <button class=\"btn btn-ghost tg-tap\" style=\"font-size:13px\" sc-camel-on-click=\"{{ go.forgot }}\">Forgot password<\u002Fbutton>\n                <button class=\"btn btn-ghost tg-tap\" style=\"font-size:13px\" sc-camel-on-click=\"{{ go.basics }}\">Create account<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.basics }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:33%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">The basics<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-6)\">Step 1 of 3<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-4)\">\n                <div style=\"display:flex;gap:var(--space-3)\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">First name<\u002Flabel>\n                    <input class=\"input\" style=\"height:46px\" value=\"{{ form.name }}\" sc-camel-on-input=\"{{ set.name }}\" placeholder=\"Daniel\">\n                  <\u002Fdiv>\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">Last name<\u002Flabel>\n                    <input class=\"input\" style=\"height:46px\" value=\"{{ form.last }}\" sc-camel-on-input=\"{{ set.last }}\" placeholder=\"Rosen\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">Name tag<\u002Flabel>\n                  <div style=\"display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--color-divider);background:var(--color-surface)\">\n                    <span style=\"font-size:15px;color:var(--color-accent-800)\">@<\u002Fspan>\n                    <input style=\"flex:1;height:100%;border:0;background:transparent;outline:none;font:400 15px var(--font-body);color:var(--color-text)\" value=\"{{ form.handle }}\" sc-camel-on-input=\"{{ set.handle }}\" placeholder=\"danielr\">\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px;color:{{ handleColor }}\">{{ handleNote }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between\">\n                    <label style=\"font-size:13px;font-weight:600\">Date of birth<\u002Flabel>\n                    <span style=\"font-size:12px;color:var(--color-accent-800)\">{{ ageLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"position:relative;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-surface);overflow:hidden\">\n                    <div style=\"position:absolute;inset-inline:8px;top:44px;height:44px;border-radius:12px;background:var(--color-accent-100);pointer-events:none\"><\u002Fdiv>\n                    <div style=\"position:relative;display:grid;grid-template-columns:1fr 1.5fr 1.1fr\">\n                      <div class=\"tg-wheel\" data-wheel=\"d\" sc-camel-on-scroll=\"{{ set.bDay }}\">\n                        <sc-for list=\"{{ dayOpts }}\" as=\"o\" hint-placeholder-count=\"31\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div class=\"tg-wheel\" data-wheel=\"m\" sc-camel-on-scroll=\"{{ set.bMonth }}\">\n                        <sc-for list=\"{{ monthOpts }}\" as=\"o\" hint-placeholder-count=\"12\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div class=\"tg-wheel\" data-wheel=\"y\" sc-camel-on-scroll=\"{{ set.bYear }}\">\n                        <sc-for list=\"{{ yearOpts }}\" as=\"o\" hint-placeholder-count=\"40\">\n                          <div style=\"color:{{ o.color }};font-weight:{{ o.weight }}\">{{ o.label }}<\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">Scroll each column. Your age shows on your profile, never the date.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:var(--space-3)\">\n                  <div style=\"flex:1;display:flex;flex-direction:column;gap:6px\">\n                    <label style=\"font-size:13px;font-weight:600\">Gender<\u002Flabel>\n                    <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.gender }}\" sc-camel-on-change=\"{{ set.gender }}\">\n                      <option value=\"\">Select<\u002Foption>\n                      <option value=\"Man\">Man<\u002Foption>\n                      <option value=\"Woman\">Woman<\u002Foption>\n                      <option value=\"Other\">Other<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">Show me<\u002Flabel>\n                  <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.seeking }}\" sc-camel-on-change=\"{{ set.seeking }}\">\n                    <option value=\"\">Select<\u002Foption>\n                    <option value=\"Women\">Women<\u002Foption>\n                    <option value=\"Men\">Men<\u002Foption>\n                    <option value=\"Everyone\">Everyone<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <label style=\"font-size:13px;font-weight:600\">What you are here for<\u002Flabel>\n                  <sc-raw-select class=\"input\" style=\"height:46px\" value=\"{{ form.intent }}\" sc-camel-on-change=\"{{ set.intent }}\">\n                    <option value=\"\">Select<\u002Foption>\n                    <option value=\"A relationship\">A relationship<\u002Foption>\n                    <option value=\"Open to a relationship\">Open to a relationship<\u002Foption>\n                    <option value=\"Still working it out\">Still working it out<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-height:var(--space-6)\"><\u002Fdiv>\n              <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0 0 var(--space-2)\">{{ basicsHint }}<\u002Fp>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ basicsInvalid }}\" sc-camel-on-click=\"{{ go.photos }}\">Continue<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.photos }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:66%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">Photos and prompts<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-4)\">Step 2 of 3 · at least one photo, up to six<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2)\">\n                <sc-for list=\"{{ myPhotoSlots }}\" as=\"slot\" hint-placeholder-count=\"6\">\n                  <div class=\"tg-tap\" style=\"aspect-ratio:3/4;border-radius:var(--radius-md);background:{{ slot.bg }};display:grid;place-items:center;color:{{ slot.fg }};font-family:var(--font-heading);font-size:22px;border:{{ slot.border }}\" sc-camel-on-click=\"{{ addPhoto }}\">{{ slot.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:var(--space-2) 0 var(--space-6)\">Your first photo is the one people meet.<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-3);border-radius:var(--radius-lg);border:1px solid var(--color-accent-300);background:var(--color-accent-100);padding:var(--space-4)\">\n                <div style=\"display:flex;flex-direction:column;gap:4px\">\n                  <span style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)\">The scribble · only on Together<\u002Fspan>\n                  <h3 style=\"font-family:var(--font-heading);font-size:22px;margin:0;line-height:1.15\">Tell us the useless things<\u002Fh3>\n                  <p style=\"font-size:13px;margin:0;color:var(--color-accent-800);text-wrap:pretty\">This is not a bio. Nobody reads it but the matcher. It works on the small, specific, slightly embarrassing details — the ones a tick-box list can never hold.<\u002Fp>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--color-accent-800);text-wrap:pretty\">\n                  <span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:var(--color-accent-600);color:#fff;display:grid;place-items:center;font-size:12px\">1<\u002Fspan>\n                  <span>Two people who both hate the beach in August match better than two people who both ticked \"loves travel\".<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--color-accent-800);text-wrap:pretty\">\n                  <span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:var(--color-accent-600);color:#fff;display:grid;place-items:center;font-size:12px\">2<\u002Fspan>\n                  <span>Spelling, order and coherence do not matter. Lists, fragments, contradictions — all of it is usable.<\u002Fspan>\n                <\u002Fdiv>\n\n                <textarea class=\"input\" style=\"border-radius:var(--radius-md);min-height:150px;padding:14px;font-family:var(--font-body);font-size:14px;line-height:1.5;resize:none;background:var(--color-surface)\" value=\"{{ form.about }}\" sc-camel-on-input=\"{{ set.about }}\" placeholder=\"Start anywhere. The song on repeat at 2am. What you cook when nobody is watching. The argument you keep having with your brother. Cats, but only other people's.\"><\u002Ftextarea>\n\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <span style=\"font-size:11.5px;color:var(--color-accent-800)\">Stuck? Tap one and keep going.<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                    <sc-for list=\"{{ nudges }}\" as=\"n\" hint-placeholder-count=\"5\">\n                      <button class=\"tg-tap\" style=\"border:1px dashed var(--color-accent-400);background:transparent;color:var(--color-accent-700);border-radius:999px;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;text-align:start;font:400 12.5px var(--font-body);cursor:pointer\" sc-camel-on-click=\"{{ n.add }}\">{{ n.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--color-accent-300);padding-top:var(--space-3)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                    <span style=\"font-size:12px;font-weight:600\">{{ scribbleNote }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:var(--color-accent-800)\">{{ scribbleCount }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:6px;border-radius:999px;background:var(--color-accent-200);overflow:hidden\"><div style=\"height:100%;width:{{ scribbleW }};background:var(--color-accent-600);border-radius:999px;transition:width .4s ease\"><\u002Fdiv><\u002Fdiv>\n                  <sc-if value=\"{{ hasSignals }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:2px\">\n                      <span style=\"font-size:11.5px;color:var(--color-accent-800)\">Picked up so far<\u002Fspan>\n                      <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ signals }}\" as=\"s\" hint-placeholder-count=\"3\">\n                          <span style=\"background:var(--color-accent-2-200);color:var(--color-accent-2-900);border-radius:999px;padding:5px 12px;font-size:12px\">{{ s.label }}<\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <p style=\"font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent);margin:0;text-wrap:pretty\">Private. Never shown on your profile, never quoted to anyone. You can rewrite it any time and matching shifts with it.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-height:var(--space-6)\"><\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" disabled=\"{{ noPhotos }}\" sc-camel-on-click=\"{{ go.verify }}\">Continue<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.verify }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);animation:tg-in .3s ease\">\n              <div style=\"height:5px;border-radius:999px;background:var(--color-accent-200);overflow:hidden;margin-bottom:var(--space-4)\">\n                <div style=\"height:100%;width:100%;background:var(--color-accent-500);border-radius:999px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <h2 style=\"font-size:30px;margin:0\">Prove you are you<\u002Fh2>\n              <p style=\"font-size:14px;color:var(--color-accent-800);margin:6px 0 var(--space-6)\">Step 3 of 3 · optional, and you can do it later<\u002Fp>\n              <div style=\"display:grid;place-items:center;margin:var(--space-4) 0\">\n                <div style=\"width:170px;height:170px;border-radius:999px;background:var(--color-accent-2-200);display:grid;place-items:center\">\n                  <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-6)\">\n                <p style=\"font-size:14px;margin:0\">Takes about a minute.<\u002Fp>\n                <p style=\"font-size:14px;margin:0\">Your selfie stays private — we never publish it.<\u002Fp>\n                <p style=\"font-size:14px;margin:0\">Verified profiles get a check mark and get liked more.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.verifySelfie }}\">Take a selfie<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.welcome }}\">Do this later<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.welcome }}\">\n            <div style=\"min-height:730px;display:flex;flex-direction:column;padding:var(--space-6);animation:tg-in .3s ease\">\n              <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--space-4)\">\n                <h2 style=\"font-size:38px;margin:0;line-height:1.05\">You are in,<br>Daniel.<\u002Fh2>\n                <p style=\"font-size:16px;color:var(--color-accent-800);margin:0;max-width:290px;text-wrap:pretty\">One connection at a time. When it is going somewhere, you will not be distracted. When it is not, you free the slot and move on.<\u002Fp>\n                <div class=\"card elev-sm\" style=\"margin-top:var(--space-4)\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                    <span style=\"font-size:13px;font-weight:600\">Profile strength<\u002Fspan>\n                    <span style=\"font-size:13px;color:var(--color-accent-800)\">{{ profilePct }}%<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height:8px;border-radius:999px;background:var(--color-accent-2-200);overflow:hidden\">\n                    <div style=\"height:100%;width:{{ profilePctW }};background:var(--color-accent-2-600);border-radius:999px;transition:width .5s ease\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:6px\">\n                    <sc-for list=\"{{ profileSteps }}\" as=\"step\" hint-placeholder-count=\"4\">\n                      <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;color:{{ step.color }}\">\n                        <span style=\"width:18px;height:18px;border-radius:999px;flex:none;display:grid;place-items:center;background:{{ step.dot }};color:#fff;font-size:11px\">{{ step.mark }}<\u002Fspan>{{ step.label }}\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button class=\"btn btn-primary btn-block tg-tap\" style=\"height:50px\" sc-camel-on-click=\"{{ go.discover }}\">Start discovering<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ at.discover }}\">\n            <div style=\"animation:tg-in .3s ease\">\n              <div style=\"position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--color-bg) 88%,transparent);backdrop-filter:blur(10px);padding:var(--space-2) var(--space-4) var(--space-3)\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2)\">\n                  <span style=\"font-family:var(--font-heading);font-size:22px\">Discover<\u002Fspan>\n                  <div class=\"seg\" style=\"height:32px\">\n                    <button class=\"seg-opt tg-tap\" style=\"font-size:12px;padding:0 14px;background:{{ segSingle }}\" sc-camel-on-click=\"{{ setMode.single }}\">People<\u002Fbutton>\n                    <button class=\"seg-opt tg-tap\" style=\"font-size:12px;padding:0 14px;background:{{ segCouple }}\" sc-camel-on-click=\"{{ setMode.couples }}\">Couples<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px\">\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortA }};color:{{ sortAc }}\" sc-camel-on-click=\"{{ setSort.recommended }}\">Recommended<\u002Fbutton>\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortB }};color:{{ sortBc }}\" sc-camel-on-click=\"{{ setSort.nearby }}\">Nearby<\u002Fbutton>\n                  <button class=\"tag tg-tap\" style=\"border:0;cursor:pointer;background:{{ sortC }};color:{{ sortCc }}\" sc-camel-on-click=\"{{ setSort.curated }}\">Curated for you<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ slotFull }}\">\n                <div style=\"margin:0 var(--space-4) var(--space-3);padding:12px 16px;border-radius:var(--radius-md);background:var(--color-accent-2-100);display:flex;gap:10px;align-items:flex-start\">\n                  <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.75\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 8v5\"><\u002Fpath><path d=\"M12 16.5h.01\"><\u002Fpath><\u002Fsvg>\n                  <p style=\"font-size:12.5px;margin:0;color:var(--color-accent-2-800);text-wrap:pretty\">You are focused on
